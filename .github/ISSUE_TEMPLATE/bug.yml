name: 播放器 Bug
description: 播放、歌词、循环或本地导入问题
body:
  - type: textarea
    id: behavior
    attributes:
      label: 预期行为 / 实际行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 设备 / 版本 / 诊断
      description: 粘贴 App 内生成的报告；不要附带私人音频。
  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 日志（可选）
