name: Android debug APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['main', 'feature/**', 'fix/**']
    tags: ['android-test-*']
concurrency:
  group: android-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Preview version metadata
        id: version
        run: node scripts/prepare-android-preview.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - name: Restore fixed debug signer when configured
        if: github.event_name != 'pull_request'
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          data = os.environ.get('DEBUG_KEYSTORE', '')
          env = Path(os.environ['GITHUB_ENV'])
          if data:
              path = Path.home() / '.android/debug.keystore'
              path.parent.mkdir(exist_ok=True)
              path.write_bytes(base64.b64decode(data, validate=True))
              path.chmod(0o600)
          with env.open('a') as f:
              f.write('PREVIEW_SIGNING=' + ('repository-secret' if data else 'ephemeral-debug') + '\n')
          PY
      - name: Complete App check and debug APK
        run: npm run android:check
      - run: npx playwright-core install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Browser navigation, responsive piano and real PCM gate
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-browser-screenshots
          path: test-results/piano-browser
      - name: Validate public APK and prepare downloads
        run: python3 scripts/verify-public-apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview-${{ github.sha }}
          path: preview-dist
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: anisong-debug-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-reports
          path: apps/android/app/build/reports
  publish:
    needs: apk
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/piano-p0')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: android-preview-${{ github.sha }}
          path: preview-dist
      - name: Publish Alpha APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-android-preview.mjs
