name: Web checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - run: npm run build
      - run: node --experimental-vm-modules scripts/verify-built-app.mjs
      - run: node scripts/verify-lyrics-build.mjs
      - run: npx playwright-core install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piano-browser-screenshots
          path: test-results/piano-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: test-results.xml
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
