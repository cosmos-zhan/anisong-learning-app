name: NetEase provider check
on:
  workflow_dispatch:
  push:
    branches: ['fix/mobile-home-scroll']
    paths: ['scripts/probe-netease-provider.mjs', '.github/workflows/netease-provider.yml']
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/probe-netease-provider.mjs
